name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez. No cancelamos los que ya están en curso para no
# dejar a medias una publicación que ya haya empezado.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true reconfigura el sitio de Pages para publicar desde
      # Actions en lugar de desde la rama (build_type: workflow).
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # El repo trae el pack de sprites entero (42.500 ficheros). Publicarlo tal
      # cual hace que deploy-pages se pase de los 10 minutos y el sitio se quede
      # sin actualizar, asi que se sube solo lo que el juego pide (~4.800).
      - name: Montar el sitio
        run: ./tools/build-site.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # Ojo: el input timeout de esta accion esta capado a 600000 ms (10 min).
      # Pedir mas se ignora con un warning, no sirve de nada.
      - id: deployment
        uses: actions/deploy-pages@v4
