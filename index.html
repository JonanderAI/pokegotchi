<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>PokéGotchi</title>
<link rel="icon" href="sprites/pokemon-icons/pokemon/icons/egg.png" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<link rel="stylesheet" href="css/base.css" />
</head>
<body>
  <div id="screen">
    <div id="info-card">
      <div id="info-icon-box"><img id="info-icon" alt="" /></div>
      <div id="info-text">
        <p id="info-name">???</p>
        <p id="info-stage"></p>
      </div>
      <p id="info-level"></p>
    </div>
    <div id="info-xp"><i></i></div>

    <div id="statbar">
      <div class="stat-row" data-stat="hunger"><img alt="Hambre" /><div class="stat-dots"></div></div>
      <div class="stat-row" data-stat="happiness"><img alt="Felicidad" /><div class="stat-dots"></div></div>
      <div class="stat-row" data-stat="hygiene"><img alt="Higiene" /><div class="stat-dots"></div></div>
      <div class="stat-row" data-stat="energy"><img alt="Energía" /><div class="stat-dots"></div></div>
    </div>

    <div id="view-root"></div>

    <div id="banner" class="hidden"></div>

    <div id="more-panel" class="hidden">
      <button class="more-btn" data-more="pokedex"><i class="fa-solid fa-book"></i> Pokédex</button>
      <button class="more-btn" data-more="settings"><i class="fa-solid fa-gear"></i> Ajustes</button>
      <button class="more-btn" data-more="info"><i class="fa-solid fa-circle-info"></i> Info</button>
    </div>

    <nav id="pillnav">
      <button class="pill-btn" data-tab="home"><i class="fa-solid fa-house"></i><span>Pokémon</span></button>
      <button class="pill-btn" data-tab="bag"><i class="fa-solid fa-briefcase"></i><span>Mochila</span></button>
      <button class="pill-btn" data-tab="more"><i class="fa-solid fa-ellipsis"></i><span>Más</span></button>
    </nav>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
